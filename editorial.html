<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Diseño editorial · Abigayd Espinosa</title>
  <meta name="description" content="Proyectos de diseño editorial de Abigayd Espinosa.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --bg: #0A0807;
      --surface: rgba(20, 18, 17, 0.7);
      --surface-2: rgba(242, 5, 92, 0.15);
      --surface-border: rgba(242, 203, 5, 0.3);
      --fg: #e8e2d9;
      --fg-muted: #a89d90;
      --accent: #F2055C;
      --accent-2: #F2059F;
      --accent-3: #F2CB05;
      --accent-4: #F2B705;
      --accent-5: #F25C05;
      --shadow: rgba(242, 5, 92, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg); background-image: radial-gradient(circle at 10% 20%, rgba(242, 5, 92, 0.15) 0%, transparent 60%); font-family: 'Inter', sans-serif; color: var(--fg); line-height: 1.4; min-height: 100vh; opacity: 0; animation: pageFadeIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes pageFadeIn { 0% { opacity: 0; filter: blur(12px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; filter: blur(0); } }
    .fade-up { opacity: 0; transform: translateY(30px); animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .fade-up.delay-1 { animation-delay: 0.3s; }
    .fade-up.delay-2 { animation-delay: 0.5s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .cursive-marker { font-family: 'Syne', cursive; font-weight: 600; letter-spacing: -0.02em; }
    .app { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }
    .nav-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 2rem; margin-bottom: 3rem; padding-bottom: 1rem; border-bottom: 1px solid var(--surface-border); }
    .logo-moderno a { text-decoration: none; }
    .logo-moderno h1 { font-size: 1.9rem; font-weight: 800; background: linear-gradient(130deg, var(--accent-2), var(--accent-3), var(--accent-5)); background-clip: text; -webkit-background-clip: text; color: transparent; letter-spacing: -0.03em; }
    .logo-moderno p { font-size: 0.7rem; letter-spacing: 3px; color: var(--accent); font-weight: 500; }
    .tabs { display: flex; align-items: center; gap: 0.2rem; background: var(--surface); backdrop-filter: blur(12px); border-radius: 80px; padding: 0.3rem; border: 1px solid var(--surface-border); }
    .tab-btn { background: transparent; border: none; padding: 0.7rem 1.8rem; font-family: inherit; font-weight: 600; font-size: 0.9rem; border-radius: 60px; cursor: pointer; transition: 0.2s; color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; opacity: 0.75; }
    .tab-btn i { margin-right: 8px; }
    .tab-btn:hover { color: var(--accent); background: var(--surface-2); opacity: 1; }
    .tab-btn.active { background: linear-gradient(115deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 6px 14px var(--shadow); opacity: 1; }
    .page-header { margin-bottom: 3.5rem; }
    .section-sub { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 4px; color: var(--accent-5); margin-bottom: 0.5rem; font-weight: 600; }
    h2 { font-size: clamp(2.2rem, 5vw, 3.5rem); font-weight: 800; background: linear-gradient(135deg, var(--fg), var(--accent-3)); background-clip: text; -webkit-background-clip: text; color: transparent; margin-bottom: 0.5rem; line-height: 1; }
    
    /* Estilos especiales para el visor de HeyZine */
    .editorial-grid { display: grid; grid-template-columns: 1fr; gap: 3rem; }
    .editorial-item { background: var(--surface); border-radius: 32px; padding: 1.5rem; border: 1px solid var(--surface-border); box-shadow: 0 4px 20px var(--shadow); }
    .editorial-title { font-size: 1.5rem; font-weight: 800; color: var(--fg); margin-bottom: 0.5rem; }
    .editorial-desc { font-size: 0.9rem; color: var(--fg-muted); margin-bottom: 1.5rem; }
    .flipbook-wrapper iframe { width: 100%; height: 600px; border-radius: 20px; border: 1px solid var(--surface-border); }
    
    footer { margin-top: 4rem; text-align: center; opacity: 0.75; font-size: 0.75rem; border-top: 1px dashed var(--surface-border); padding: 2rem; color: var(--fg-muted); }
    footer p { margin: 0.3rem 0; }
    @media (max-width: 880px) { 
      .app { padding: 1rem; } 
      .tabs { flex-wrap: wrap; } 
      .tab-btn { padding: 0.5rem 1rem; font-size: 0.8rem; } 
      .flipbook-wrapper iframe { height: 400px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="nav-header fade-up">
    <div class="logo-moderno">
      <a href="index.html"><h1>ABIGAYD ESPINOSA</h1><p class="cursive-marker">▸ Diseñadora gráfica</p></a>
    </div>
    <nav class="tabs">
      <a href="index.html" class="tab-btn">Inicio</a>
      <a href="trabajos.html" class="tab-btn active">Trabajos</a>
      <a href="sobre-mi.html" class="tab-btn">Sobre mí</a>
      <a href="contacto.html" class="tab-btn">Contacto</a>
    </nav>
  </div>

  <div class="page-header fade-up delay-1">
    <div class="section-sub">Categoría completa</div>
    <h2>Diseño editorial</h2>
  </div>

  <div class="editorial-grid fade-up delay-2" id="fullGrid"></div>

  <footer>
    <p>© 2026 Abigayd Espinosa · Diseñadora Gráfica</p>
    <p>✦ Freelancer · Todos los proyectos son bienvenidos ✦</p>
  </footer>
</div>

<script>
  const items = [
    {
      title: "Dango Time — Monster Hunter",
      category: "Editorial Design",
      desc: "Revista digital con maquetación editorial temática, disponible como flip-book interactivo.",
      flipbook: "https://heyzine.com/flip-book/7ad8a6dbcf.html"
    },
    {
      title: "Tierra Verde",
      category: "Editorial Design",
      desc: "Proyecto editorial enfocado en la naturaleza y sostenibilidad, disponible como flip-book interactivo.",
      flipbook: "https://heyzine.com/flip-book/ba71b95227.html"
    }
  ];

  const grid = document.getElementById('fullGrid');

  items.forEach(work => {
    const div = document.createElement('div');
    div.className = 'editorial-item';
    div.innerHTML = `
      <div class="section-sub" style="font-size: 0.75rem; letter-spacing: 2px;">${work.category}</div>
      <div class="editorial-title">${work.title}</div>
      <div class="editorial-desc">${work.desc}</div>
      <div class="flipbook-wrapper">
        <iframe allowfullscreen allow="autoplay; fullscreen; clipboard-write" scrolling="no" src="${work.flipbook}"></iframe>
      </div>
    `;
    grid.appendChild(div);
  });
</script>
</body>
</html>
</html>
